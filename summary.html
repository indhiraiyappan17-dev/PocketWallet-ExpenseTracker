<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketWallet - Monthly Summary</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header>
    <h1>PocketWallet</h1>
    <p>Monthly Summary</p>
</header>

<nav>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dash.html">Dashboard</a></li>
        <li><a href="add.html">Add Transaction</a></li>
        <li><a href="transaction.html">History</a></li>
        <li><a href="summary.html">Summary</a></li>
    </ul>
</nav>

<main>

    <section class="summary">

        <div class="card">
            <h3>Total Income</h3>
            <h2 id="summaryIncome">₹0</h2>
        </div>

        <div class="card">
            <h3>Total Expense</h3>
            <h2 id="summaryExpense">₹0</h2>
        </div>

        <div class="card">
            <h3>Current Balance</h3>
            <h2 id="summaryBalance">₹0</h2>
        </div>

    </section>

    <section class="card">

        <h2>Category Summary</h2>

        <table>

            <thead>

                <tr>
                    <th>Category</th>
                    <th>Total Amount</th>
                </tr>

            </thead>

            <tbody id="categorySummary">

                <tr>
                    <td colspan="2">No Data Available</td>
                </tr>

            </tbody>

        </table>

    </section>

</main>
